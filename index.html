<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Suivi Vélo Optimisé</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #f8f9fa; }
    #map { height: 65vh; width: 100%; border-radius: 12px; }
    button { padding: 14px 18px; margin: 6px 4px; font-size: 17px; border-radius: 10px; }
    .status { padding: 12px; border-radius: 10px; margin: 10px 0; font-weight: bold; }
    .log { max-height: 180px; overflow-y: auto; background: #fff; padding: 12px; border-radius: 10px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>🚴 Suivi Vélo Optimisé</h1>

  <!-- Boutons principaux -->
  <button onclick="showSection('sharer')">Je suis le cycliste</button>
  <button onclick="showSection('tracker')">Suivre mon ami</button>

  <!-- MODE CYCLISTE -->
  <div id="sharer" class="section">
    <h2>🚴 Mode Cycliste</h2>
    <button onclick="startOptimizedTracking()">🚀 Top Départ</button>
    <button onclick="endTrip()">🏁 Arrivée</button>
    <button onclick="reportAccident()">🚨 Incident</button>
    
    <div id="sharerStatus" class="status"></div>
    <div class="log" id="sharerLog"></div>
  </div>

  <!-- MODE SUIVEUR -->
  <div id="tracker" class="section active">
    <h2>👀 Mode Suiveur</h2>
    <input type="text" id="tripCode" placeholder="Code trajet (ex: ABC123)" style="width:240px;padding:12px;font-size:16px;">
    <button onclick="startTracking()">Suivre</button>
    
    <div id="map"></div>
    <div id="trackerInfo" class="status"></div>
    <div class="log" id="trackerLog"></div>
  </div>

  <script>
    // ================== CONFIG FIREBASE (à remplir) ==================
    const firebaseConfig = {
      apiKey: "TA_CLE_API",
      authDomain: "ton-projet.firebaseapp.com",
      databaseURL: "https://ton-projet-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ton-projet",
      storageBucket: "ton-projet.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map, marker, tripId = null, watchId = null;
    let lastSentTime = 0;

    const CONFIG = {
      minInterval: 15000,   // 15 secondes
      highAccuracy: true,
      timeout: 10000,
      maximumAge: 5000
    };

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(section).classList.add('active');
    }

    function logSharer(msg) {
      const log = document.getElementById('sharerLog');
      log.innerHTML += `<div>${new Date().toLocaleTimeString()} — ${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    // ================== CYCLISTE ==================
    function startOptimizedTracking() {
      if (watchId) return;
      tripId = Math.random().toString(36).substring(2, 8).toUpperCase();
      
      document.getElementById('sharerStatus').innerHTML = `
        Trajet <strong>${tripId}</strong> démarré !<br>
        <small>Donne ce code à ton ami</small>
      `;

      logSharer("watchPosition activé");

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy, speed } = pos.coords;
          const now = Date.now();
          if (now - lastSentTime < CONFIG.minInterval) return;
          
          lastSentTime = now;

          db.ref('trips/' + tripId).update({
            lat: latitude,
            lng: longitude,
            accuracy: Math.round(accuracy),
            speed: speed ? (speed * 3.6).toFixed(1) : null,
            timestamp: now,
            status: 'en_route'
          });
        },
        (err) => logSharer(`Erreur : ${err.message}`),
        { enableHighAccuracy: CONFIG.highAccuracy, timeout: CONFIG.timeout, maximumAge: CONFIG.maximumAge }
      );
    }

    function endTrip() {
      if (tripId) db.ref('trips/' + tripId).update({ status: 'arrive', timestamp: Date.now() });
      stopTracking();
      alert("🏁 Arrivée signalée");
    }

    function stopTracking() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }

    // ================== INCIDENT SÉCURISÉ ==================
    function reportAccident() {
      if (!tripId) return alert("Aucun trajet actif");

      const choice = prompt("Quel type d'incident ?\n\n1 = Accident grave\n2 = Chute légère\n3 = Crevaison / Problème", "2");

      if (!choice) return;

      let msg = "";
      if (choice === "1") {
        msg = "🚨 ACCIDENT GRAVE";
        if (confirm("⚠️ Voulez-vous VRAIMENT appeler les pompiers (18) ?\n\nAppuyez sur ANNULER pour juste prévenir ton ami.")) {
          window.location.href = "tel:18";
        }
      } else if (choice === "2") {
        msg = "Chute légère";
      } else {
        msg = "Problème technique";
      }

      db.ref('trips/' + tripId).update({ alert: msg, timestamp: Date.now() });
      logSharer(`Alerte envoyée : ${msg}`);
    }

    // ================== MODE SUIVEUR ==================
    function startTracking() {
      const code = document.getElementById('tripCode').value.trim().toUpperCase();
      if (!code) return alert("Entre le code du trajet");

      if (!map) {
        map = L.map('map').setView([46.5, 2.2], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      }

      if (window.currentRef) window.currentRef.off();

      window.currentRef = db.ref('trips/' + code);
      
      window.currentRef.on('value', (snap) => {
        const d = snap.val();
        if (!d || !d.lat) return;

        document.getElementById('trackerInfo').innerHTML = `
          Dernière mise à jour : ${new Date(d.timestamp).toLocaleTimeString()}<br>
          Précision : ±${d.accuracy || '?'} m ${d.speed ? `| ${d.speed} km/h` : ''}
        `;

        if (d.alert) {
          document.getElementById('trackerLog').innerHTML += `<div style="color:red">${new Date().toLocaleTimeString()} — ${d.alert}</div>`;
        }

        if (!marker) {
          marker = L.marker([d.lat, d.lng]).addTo(map).bindPopup("Position de ton ami").openPopup();
        } else {
          marker.setLatLng([d.lat, d.lng]);
        }
        map.setView([d.lat, d.lng], 15);
      });
    }

    window.onbeforeunload = () => stopTracking();
  </script>
</body>
</html>
