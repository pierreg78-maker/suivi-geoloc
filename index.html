<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Minimal</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <h1>Test Firebase + Géolocalisation</h1>
  <button onclick="startTest()">Démarrer Test Cycliste</button>
  <div id="log" style="margin-top:20px; white-space:pre-wrap; font-family:monospace;"></div>

  <script>
    const firebaseConfig = {
      // REMPLACE PAR TA CONFIG FIREBASE
      apiKey: "",
      authDomain: "",
      databaseURL: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let tripId = null;

    function log(msg) {
      document.getElementById('log').innerHTML += new Date().toLocaleTimeString() + " | " + msg + "\n";
    }

    function startTest() {
      tripId = "TEST" + Math.floor(Math.random()*10000);
      log("Code généré : " + tripId);

      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude, longitude} = pos.coords;
        log(`Position obtenue : ${latitude}, ${longitude}`);

        db.ref('trips/' + tripId).set({
          lat: latitude,
          lng: longitude,
          timestamp: Date.now()
        }).then(() => log("✅ Données envoyées sur Firebase"))
          .catch(err => log("❌ Erreur Firebase: " + err.message));
      }, err => {
        log("❌ Erreur Géolocalisation: " + err.message);
      }, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
