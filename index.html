<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Suivi Vélo - Debug</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #f8f9fa; }
    #map { height: 60vh; width: 100%; border-radius: 12px; }
    button { padding: 14px 18px; margin: 6px 4px; font-size: 17px; }
    .status { padding: 12px; background: #d4edda; border-radius: 10px; margin: 10px 0; }
    .log { background: #222; color: #0f0; padding: 10px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🚴 Suivi Vélo - DEBUG</h1>

  <button onclick="showSection('sharer')">Je suis le cycliste</button>
  <button onclick="showSection('tracker')">Suivre mon ami</button>

  <!-- MODE CYCLISTE -->
  <div id="sharer" class="section">
    <h2>Mode Cycliste</h2>
    <button onclick="startOptimizedTracking()">🚀 Top Départ</button>
    <button onclick="endTrip()">🏁 Arrivée</button>
    <button onclick="reportAccident()">🚨 Incident</button>
    
    <div id="sharerStatus" class="status"></div>
    <div class="log" id="sharerLog"></div>
  </div>

  <!-- MODE SUIVEUR -->
  <div id="tracker" class="section active">
    <h2>Mode Suiveur</h2>
    <input type="text" id="tripCode" placeholder="Code trajet (ex: ABC123)" style="width:240px;padding:12px;">
    <button onclick="startTracking()">Suivre</button>
    
    <div id="map"></div>
    <div id="trackerInfo" class="status"></div>
    <div class="log" id="trackerLog"></div>
  </div>

  <script>
    const firebaseConfig = { /* ← REMPLIS TA CONFIG FIREBASE ICI */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map, marker, tripId = null, watchId = null;

    function showSection(s) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(s).classList.add('active');
    }

    function logSharer(msg) {
      const log = document.getElementById('sharerLog');
      log.innerHTML += `<div>${new Date().toLocaleTimeString()} → ${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    // ================== CYCLISTE ==================
    function startOptimizedTracking() {
      if (watchId) return;
      
      tripId = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('sharerStatus').innerHTML = `Trajet <b>${tripId}</b> démarré ! Partage ce code.`;

      logSharer("Démarrage watchPosition...");

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy, speed } = pos.coords;
          logSharer(`POSITION REÇUE → ${latitude.toFixed(5)}, ${longitude.toFixed(5)} (±${Math.round(accuracy)}m)`);

          db.ref('trips/' + tripId).update({
            lat: latitude,
            lng: longitude,
            accuracy: Math.round(accuracy),
            speed: speed ? (speed * 3.6).toFixed(1) : null,
            timestamp: Date.now(),
            status: 'en_route'
          }).then(() => {
            logSharer("✅ Position envoyée sur Firebase");
          });
        },
        (err) => {
          logSharer(`❌ ERREUR GÉOLOC : ${err.message} (code ${err.code})`);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
      );
    }

    function endTrip() {
      if (tripId) db.ref('trips/' + tripId).update({ status: 'arrive' });
      logSharer("Arrivée signalée");
    }

    function reportAccident() { /* même fonction sécurisée qu'avant */ }

    // ================== SUIVEUR ==================
    function startTracking() {
      const code = document.getElementById('tripCode').value.trim().toUpperCase();
      if (!code) return alert("Entre le code");

      logSharer = () => {}; // désactive les logs du cycliste dans ce mode

      if (!map) {
        map = L.map('map').setView([46.5, 2.2], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      }

      if (window.currentRef) window.currentRef.off();

      window.currentRef = db.ref('trips/' + code);
      
      window.currentRef.on('value', (snap) => {
        const d = snap.val();
        document.getElementById('trackerLog').innerHTML += `<div>${new Date().toLocaleTimeString()} → Données reçues</div>`;

        if (!d || !d.lat) {
          document.getElementById('trackerInfo').innerHTML = "En attente de position...";
          return;
        }

        document.getElementById('trackerInfo').innerHTML = `Position mise à jour à ${new Date(d.timestamp).toLocaleTimeString()}`;

        if (!marker) {
          marker = L.marker([d.lat, d.lng]).addTo(map).bindPopup("Ton ami").openPopup();
        } else {
          marker.setLatLng([d.lat, d.lng]);
        }
        map.setView([d.lat, d.lng], 15);
      });
    }

    // Nettoyage
    window.onbeforeunload = () => { if (watchId) navigator.geolocation.clearWatch(watchId); };
  </script>
</body>
</html>
